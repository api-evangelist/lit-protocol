publisherName: Lit Protocol Inc.
serviceCategory: Web3
billingModel:
  pricingCategory: Prepaid Credits
  billingFrequency: On Top-up
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
focusColumns:
  ServiceName: Lit Protocol
  ServiceCategory: Web3
  ProviderName: Lit Protocol
  PublisherName: Lit Protocol
  InvoiceIssuerName: Lit Protocol
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
- name: credits_consumed
  description: Credits consumed per operation.
  unit: credit
  aggregation: sum
  dimensions:
  - api_key
  - operation
- name: lit_action_executions
  description: Lit Action executions.
  unit: execution
  aggregation: sum
  dimensions:
  - account
  - ipfs_id
principles:
- name: Visibility
  description: Use the Lit dashboard usage view.
- name: Allocation
  description: API key per app/environment.
- name: Optimization
  description: Cache decrypted material client-side; minimize PKP signs; prefer batched
    Lit Actions.
- name: Accountability
  description: Account owner monitors prepaid balance and refills.
