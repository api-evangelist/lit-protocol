specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Lit Protocol
providerId: lit-protocol
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Web3
- Key Management
- MPC
- Programmable Keys
- Lit Actions
- Plans
description: Lit Protocol is metered as a credit-based usage system. Users add credit
  balances ($5 minimum top-up) and consume credits when executing Lit Actions and
  write operations. Read-only calls are free.
notes: Verify against developer.litprotocol.com.
sources:
- https://developer.litprotocol.com/
plans:
- id: lit-prepaid
  name: Prepaid Credits
  type: paid
  description: Pay-as-you-go credit balance topped up via credit card with a $5 minimum.
    Reads are free; signs / Lit Action executions / encryption writes consume credits.
  entries:
  - label: Minimum Top-up
    name: min_topup
    type: flat
    metric: credits
    limit: 1
    timeFrame: usage
    geo: global
    unit: 1
    price: 5
    userMultiplied: false
  - label: Per-Operation Credit Cost
    name: operation_cost
    type: metered
    metric: operation
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: see usage table
    userMultiplied: false
  elements:
  - name: PKPs
  - name: Lit Actions
  - name: Threshold Encryption
- id: lit-enterprise
  name: Enterprise
  type: enterprise
  description: Custom enterprise contracts with volume credit pricing and SLAs.
  entries:
  - label: Custom
    name: custom
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Volume Discounts
  - name: SLA
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
