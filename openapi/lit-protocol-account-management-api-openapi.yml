      - is_evm
      - testnet
      - token
      properties:
        chain_name:
          type: string
        chain_id:
          type: integer
          format: uint64
          minimum: 0.0
        is_evm:
          type: boolean
        testnet:
          type: boolean
        token:
          type: string
        contract_address:
          type: string
    NewAccountResponse:
      type: object
