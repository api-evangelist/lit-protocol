components:
  schemas:
    AddUsageApiKeyRequest:
      description: Request for add_usage_api_key. expiration and balance as decimal strings (e.g. unix timestamp, wei). API key via header.
      type: object
      required:
      - add_pkp_to_groups
      - can_create_groups
      - can_create_pkps
      - can_delete_groups
      - description
      - execute_in_groups
      - manage_ipfs_ids_in_groups
      - name
      - remove_pkp_from_groups
      properties:
        name:
          type: string
        description:
          type: string
        can_create_groups:
          type: boolean
        can_delete_groups:
          type: boolean
        can_create_pkps:
          type: boolean
        manage_ipfs_ids_in_groups:
          description: Group IDs to grant manage-IPFS-IDs permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        add_pkp_to_groups:
          description: Group IDs to grant add-PKP permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        remove_pkp_from_groups:
          description: Group IDs to grant remove-PKP permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        execute_in_groups:
          description: Group IDs to grant execute permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
    ApiKeyItem:
      description: One item from list_api_keys (AccountConfig.sol UsageApiKey).
      type: object
      required:
      - api_key_hash
      - balance
      - can_add_pkp_to_groups
      - can_create_groups
      - can_create_pkps
      - can_delete_groups
      - can_execute_in_groups
      - can_manage_ipfs_ids_in_groups
      - can_remove_pkp_from_groups
      - description
      - expiration
      - id
      - name
      properties:
        id:
          type: string
        api_key_hash:
          type: string
        name:
          type: string
        description:
          type: string
        expiration:
          type: string
        balance:
          type: integer
          format: uint64
          minimum: 0.0
        can_create_groups:
          type: boolean
        can_delete_groups:
          type: boolean
        can_create_pkps:
          type: boolean
        can_manage_ipfs_ids_in_groups:
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        can_add_pkp_to_groups:
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        can_remove_pkp_from_groups:
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        can_execute_in_groups:
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
    AddUsageApiKeyResponse:
      description: Response for account config operations (add_group, add_pkp_to_group, remove_pkp_from_group, add_usage_api_key, remove_usage_api_key).
      type: object
      required:
      - success
      - usage_api_key
      properties:
        success:
          type: boolean
        usage_api_key:
          type: string
    AddGroupResponse:
      description: Response for add_group, includes the on-chain group ID.
      type: object
      required:
      - group_id
      - success
      properties:
        success:
          type: boolean
        group_id:
          type: string
    DeleteActionRequest:
      description: Request for delete_action. hashed_cid is already a keccak256 hash (hex string). API key via header.
      type: object
      required:
      - hashed_cid
      properties:
        hashed_cid:
          description: Already-hashed CID for the action (0x-prefixed hex string).
          type: string
    ChainConfigKeysResponse:
      description: GET /get_chain_config_keys — names of every supported ConfigKeys variant.
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: string
    CreateWalletWithSignatureRequest:
      description: 'ChainSecured wallet creation. The client signs EIP-712 typed data with their wallet; the server verifies the signature, mints a PKP via DStack MPC, and returns the new wallet address + derivation path so the client can register it on-chain via `registerWalletDerivation`.


        The server does not maintain a nonce store. Replay protection is a ±5-minute window on the `issuedAt` field plus the per-flow primaryType binding — worst-case replay still just mints an extra unregistered PKP (compute cost only; registration requires a separate wallet signature on-chain).'
      type: object
      required:
      - signature
      - typed_data
      properties:
        typed_data:
          description: 'EIP-712 typed-data object the wallet signed. Must use `primaryType: "CreateWallet"` and the canonical schema (see `core::eip712`).'
        signature:
          description: 65-byte 0x-prefixed signature (r||s||v) over the EIP-712 digest of `typed_data`.
          type: string
    AddUsageApiKeyWithSignatureRequest:
      description: 'ChainSecured usage-key minting. Mirrors `CreateWalletWithSignatureRequest`: the user proves wallet ownership with an EIP-712 typed-data signature, the server mints a usage-key wallet via DStack MPC and returns the secret (as the usage API key) plus address + derivation path. The client follows up with on-chain `registerWalletDerivation` and `setUsageApiKey` signed by their admin wallet — only the admin wallet of a ChainSecured account can call `setUsageApiKey` (see AppStorage.accountExistsAndIsMutable).'
      type: object
      required:
      - signature
      - typed_data
      properties:
        typed_data:
          description: 'EIP-712 typed-data object the wallet signed. Must use `primaryType: "AddUsageApiKey"` and the canonical schema (see `core::eip712`).'
        signature:
          description: 65-byte 0x-prefixed signature (r||s||v) over the EIP-712 digest of `typed_data`.
          type: string
    UpdateUsageApiKeyRequest:
      description: Request for update_usage_api_key. Updates all permissions and metadata on an existing usage API key. API key via header.
      type: object
      required:
      - add_pkp_to_groups
      - can_create_groups
      - can_create_pkps
      - can_delete_groups
      - description
      - execute_in_groups
      - manage_ipfs_ids_in_groups
      - name
      - remove_pkp_from_groups
      - usage_api_key
      properties:
        usage_api_key:
          type: string
        name:
          type: string
        description:
          type: string
        can_create_groups:
          type: boolean
        can_delete_groups:
          type: boolean
        can_create_pkps:
          type: boolean
        manage_ipfs_ids_in_groups:
          description: Group IDs to grant manage-IPFS-IDs permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        add_pkp_to_groups:
          description: Group IDs to grant add-PKP permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        remove_pkp_from_groups:
          description: Group IDs to grant remove-PKP permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
        execute_in_groups:
          description: Group IDs to grant execute permission. 0 is wildcard for all groups.
          type: array
          items:
            type: integer
            format: uint64
            minimum: 0.0
    CreateWalletResponse:
      type: object
