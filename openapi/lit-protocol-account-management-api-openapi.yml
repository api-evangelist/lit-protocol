      required:
      - account_description
      - account_name
      properties:
        account_name:
          type: string
        account_description:
          type: string
        email:
          description: Optional email address — forwarded to Stripe for the customer record.  Not stored on-chain.
          default: null
          type: string
          nullable: true
    AccountOpResponse:
      description: Response for account config operations (add_pkp_to_group, remove_pkp_from_group, add_usage_api_key, remove_usage_api_key).
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
    AddPkpToGroupRequest:
      type: object
      required:
      - group_id
      - pkp_id
      properties:
        group_id:
          description: Group ID (decimal or hex string).
          type: integer
          format: uint64
          minimum: 0.0
        pkp_id:
          type: string
    UpdateUsageApiKeyMetadataRequest:
      description: Request for update_usage_api_key_metadata (AccountConfig.updateUsageApiKeyMetadata). API key via header.
      type: object
      required:
      - description
      - name
      - usage_api_key
      properties:
        usage_api_key:
          type: string
        name:
          type: string
        description:
          type: string
    AddUsageApiKeyWithSignatureResponse:
      description: Returned by `/add_usage_api_key_with_signature`. The client must follow up with on-chain `registerWalletDerivation(adminHash, wallet_address, derivation_path, name, description)` and `setUsageApiKey(adminHash, keccak256(usage_api_key), …)` — both signed by the admin wallet — to attach the usage key to the ChainSecured account.
      type: object
      required:
      - derivation_path
      - usage_api_key
      - wallet_address
      properties:
        usage_api_key:
          description: 'Base64-encoded 32-byte secret. Send as `X-Api-Key` / `Authorization: Bearer …` for usage requests; pass `keccak256(this)` to `setUsageApiKey`.'
          type: string
        wallet_address:
          description: 0x-prefixed lowercase hex EVM address of the minted PKP wallet.
          type: string
        derivation_path:
          description: 0x-prefixed lowercase hex (uint256). Pass through verbatim to `registerWalletDerivation`'s `derivationPath` arg.
          type: string
    ErrMessage:
      type: string
    WalletItem:
      description: One item from list_groups, list_wallets, list_wallets_in_group, or list_actions (AccountConfig.sol Metadata).
      type: object
      required:
      - description
      - id
      - name
      - wallet_address
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        wallet_address:
          type: string
    UpdateActionMetadataRequest:
      description: Request for update_action_metadata. hashed_cid is already a keccak256 hash (hex string). API key via header.
      type: object
      required:
      - description
      - hashed_cid
      - name
      properties:
        hashed_cid:
          description: Already-hashed CID for the action (0x-prefixed hex string).
          type: string
        name:
          type: string
        description:
          type: string
    RemoveActionFromGroupRequest:
      description: Request for remove_action_from_group. hashed_cid is already a keccak256 hash (hex string). API key via header.
      type: object
      required:
      - group_id
      - hashed_cid
      properties:
        group_id:
          type: integer
          format: uint64
          minimum: 0.0
        hashed_cid:
          description: Already-hashed CID for the action (0x-prefixed hex string).
          type: string
    CreateWalletWithSignatureResponse:
      description: Returned by `/create_wallet_with_signature`. The client must follow up with an on-chain `registerWalletDerivation(adminHash, wallet_address, derivation_path, name, description)` call signed by the same wallet — until that lands, the PKP exists in MPC but is not registered to any account.
      type: object
      required:
      - derivation_path
      - wallet_address
      properties:
        wallet_address:
          type: string
        derivation_path:
          description: 0x-prefixed lowercase hex (uint256). Pass through verbatim to `registerWalletDerivation`'s `derivationPath` arg.
          type: string
    UpdateGroupRequest:
      description: Request for update_group (AccountConfig.updateGroup). API key via header.
      type: object
      required:
      - description
      - group_id
      - name
      properties:
        group_id:
          description: Group ID (decimal or hex string).
          type: integer
          format: uint64
          minimum: 0.0
        name:
          type: string
        description:
          type: string
        pkp_ids_permitted:
          default: []
          type: array
          items:
            type: string
        cid_hashes_permitted:
          default: []
          type: array
          items:
            type: string
    ListMetadataItem:
      description: One item from list_groups, list_wallets, list_wallets_in_group, or list_actions (AccountConfig.sol Metadata).
      type: object
      required:
      - description
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    AddGroupRequest:
      description: Request for add_group. permitted_actions and pkps are keccak256 hashes as hex strings (with or without 0x). API key via header.
      type: object
      required:
      - cid_hashes_permitted
      - group_description
      - group_name
      - pkp_ids_permitted
      properties:
        group_name:
          description: Name of the group (Group.metadata.name in AccountConfig.sol).
          type: string
        group_description:
          description: Description of the group (Group.metadata.description in AccountConfig.sol).
          type: string
        pkp_ids_permitted:
          description: pkp ids permitted to use the group (AccountConfig.sol Group.pkpId).
          type: array
          items:
            type: string
        cid_hashes_permitted:
          description: Actions permitted to use the group (AccountConfig.sol Group.cidHash).
          type: array
          items:
            type: string
    AddActionRequest:
      type: object
      required:
      - action_ipfs_cid
      - description
      - name
      properties:
        action_ipfs_cid:
          description: IPFS CID for the action (keccak256-hashed on server).
          type: string
        name:
          type: string
        description:
          type: string
    RemoveUsageApiKeyRequest:
      description: API key via header.
      type: object
      required:
      - usage_api_key
      properties:
        usage_api_key:
          type: string
    AddActionToGroupRequest:
      type: object
      required:
      - action_ipfs_cid
      - group_id
      properties:
        group_id:
          type: integer
          format: uint64
          minimum: 0.0
        action_ipfs_cid:
          description: IPFS CID for the action (will be keccak256-hashed on server).
          type: string
    RemovePkpFromGroupRequest:
      type: object
      required:
      - group_id
      - pkp_id
      properties:
        group_id:
          type: integer
          format: uint64
          minimum: 0.0
        pkp_id:
          type: string
    RemoveGroupRequest:
      type: object
      required:
      - group_id
      properties:
        group_id:
          type: string
    ConvertToChainSecuredAccountRequest:
      description: Body for `convert_to_chain_secured_account`. The caller is authenticated by their existing API key (header). The supplied wallet becomes the on-chain admin and the account flips from managed to ChainSecured. The conversion is irreversible.
      type: object
      required:
      - new_admin_wallet_address
      - signature
      - typed_data
      properties:
        new_admin_wallet_address:
          description: Hex-encoded EVM address (with or without 0x prefix). Must be the wallet the user controls; verified by an EIP-712 typed-data signature.
          type: string
        typed_data:
          description: 'EIP-712 typed-data object the wallet signed. Must use `primaryType: "ConvertAccount"` and the canonical schema (see `core::eip712`).'
        signature:
          description: 65-byte 0x-prefixed signature (r||s||v) over the EIP-712 digest of `typed_data`.
          type: string
