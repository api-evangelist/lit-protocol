description: The Chipotle API enforces per-API-key rate limits and a credit-balance
  gate. Read endpoints are unmetered.
notes: Limits documented in the Chipotle OpenAPI spec response codes.
sources:
- https://api.chipotle.litprotocol.com/core/v1/openapi.json
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: api_key
  metric: requests_per_second
  limit: 10
  notes: Default Chipotle API throughput.
- name: Credit Balance Gate
  scope: account
  metric: credits
  limit: depends on top-up
  notes: Operations halt when balance reaches $0.
policies:
- name: Backoff Strategy
  description: Exponential backoff on 429; refill credits to resume operations.
